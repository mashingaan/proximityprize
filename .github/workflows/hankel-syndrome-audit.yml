name: Exact syndrome pencil audit
on:
  push:
    branches: [research/hankel-syndrome-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - run: python scripts/probes/probe_hankel_syndrome_pencils.py
      - run: python scripts/probes/probe_locator_rank_boundary.py
      - run: python scripts/probes/verify_locator_rs10_certificate.py
