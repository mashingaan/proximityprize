name: Multi-line arithmetic kernel audit
on:
  push:
    branches: [research/sponsor-finite-bracket]
    paths:
      - Research/ProximityPrize/Frontier/_IncidenceDependencyArithmetic.lean
      - .github/workflows/multiline-rank-kernel.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: multiline-kernel-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            incidence-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            incidence-dependencies-${{ runner.os }}-
      - name: Fetch dependency cache
        run: ./scripts/lake-locked.sh exe cache get
      - name: Check seven declarations and audit axioms
        run: |
          set -o pipefail
          lake env lean Research/ProximityPrize/Frontier/_IncidenceDependencyArithmetic.lean | tee multiline-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('multiline-axioms.log').read_text()
          assert 'sorryAx' not in text
          matches = re.findall(r"'(ProximityGap\.IncidenceDependencyArithmetic\.[^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]|(does not depend on any axioms))",text)
          expected = {'coordinate_count_bound','shortened_subspace_bound','quotient_shortening_bound','received_space_shortening_bound','dependency_necessary','dependency_from_coordinate_ledger','literal_dependency_excluded'}
          assert {name.rsplit('.',1)[1] for name,_,_ in matches} == expected
          assert len(matches) == 7
          for name,names,no_axioms in matches:
              if not no_axioms:
                  assert set(name.strip() for name in names.split(',')) <= {'propext','Classical.choice','Quot.sound'}
          print('Seven structural and finite-ledger declarations kernel checked')
          PY
